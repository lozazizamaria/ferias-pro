services:
  myplan:
    build: .
    container_name: myplan
    restart: always
    ports:
      - "127.0.0.1:3080:3080"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3080"
      DATA_DIR: "/app/data"
    volumes:
      - myplan_data:/app/data

volumes:
  myplan_data:
    driver: local
